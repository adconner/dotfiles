[backdrop]
enabled = false

[bar.main]
center = [ "active_window" ]
compositor_blur = false
end = [ "tray", "network", "bluetooth", "volume", "brightness", "battery", "clock", "session" ]
margin_ends = 8
start = [ "weather", "spacer_2", "workspaces" ]

[control_center.calendar]
show_events_card = false

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
enabled = false

[idle.behavior.lock]
enabled = false

[idle.behavior.screen-off]
enabled = false

[location]
address = "Chicago, IL"

[lockscreen]
enabled = false
transition = []

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[shell]
corner_radius_scale = 0.7500000111758709
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true

    [shell.animation]
    enabled = false
    speed = 0.80000001192092896

[system.monitor]
enabled = false

[theme]
builtin = "Gruvbox"
community_palette = "Oxide"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-tonal-spot"

[wallpaper]
enabled = true

[weather]
unit = "imperial"

[widget.spacer_2]
type = "spacer"
